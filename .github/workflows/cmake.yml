name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        build_type: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      - name: Install LaTeX (pdflatex)
        uses: TeX-Live/setup-texlive-action@v4
        with:
          # scheme-basic plus every package TexPreamble() (src/content/screen_primitives/LateX.cpp) pulls in
          packages: |
            scheme-basic
            preview
            varwidth
            amsmath
            amsfonts
            xcolor
            url
            aligned-overset
            mathtools
            ragged2e
            booktabs

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xorg-dev libglu1-mesa-dev libgl1-mesa-dev libegl-dev libgl1-mesa-dri imagemagick
          # some distros ship ImageMagick with PDF reading disabled by default
          # (a Ghostscript CVE mitigation); GenerateLatex() converts a pdflatex
          # output to png, so 'convert' needs it explicitly re-enabled
          sudo sed -i 's/rights="none" pattern="PDF"/rights="read|write" pattern="PDF"/' /etc/ImageMagick-6/policy.xml 2>/dev/null || true

      - name: Install macOS deps
        if: runner.os == 'macOS'
        # ghostscript is imagemagick's PDF delegate ; homebrew doesn't pull
        # it in automatically, and without it `convert` can't rasterize the
        # PDFs GenerateLatex() produces
        run: brew install imagemagick ghostscript

      - name: Install Windows deps
        if: runner.os == 'Windows'
        shell: bash
        # ghostscript is imagemagick's PDF delegate on every platform, and
        # isn't pulled in automatically (same as the macOS step above)
        run: |
          choco install imagemagick ghostscript -y
          # some ImageMagick builds ship policy.xml with PDF reading disabled
          # (a Ghostscript CVE mitigation), which would fail the pdf->png step
          # exactly as it did on Linux ; relax it wherever it turns up
          find "/c/Program Files" -name policy.xml -path '*ImageMagick*' 2>/dev/null | while read -r p; do
            sed -i 's/rights="none" pattern="PDF"/rights="read|write" pattern="PDF"/' "$p" || true
          done || true

      - name: Cache CPM sources
        uses: actions/cache@v4
        with:
          path: ${{ runner.workspace }}/cpm-cache
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/*.cmake') }}
          restore-keys: |
            cpm-${{ runner.os }}-

      - name: Configure CMake
        shell: bash
        env:
          CPM_SOURCE_CACHE: ${{ runner.workspace }}/cpm-cache
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DBUILD_SLOPE_TESTS=ON

      - name: Build
        shell: bash
        env:
          CPM_SOURCE_CACHE: ${{ runner.workspace }}/cpm-cache
        # capped rather than left to the runner's core count: an unbounded
        # -j on a Debug build of polyscope/Eigen-heavy translation units has
        # been observed to exhaust a standard runner's RAM and get SIGTERM'd
        run: cmake --build build --config ${{ matrix.build_type }} --parallel 2

      - name: Test
        shell: bash
        run: ctest --test-dir build --build-config ${{ matrix.build_type }} --output-on-failure
